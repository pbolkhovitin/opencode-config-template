# Пример scope-файла для ot-guard.sh.
# Скопируйте, заполните под площадку и передайте через --scope или OT_SCOPE_FILE.
# Формат: KEY=VALUE, по одному на строку. Комментарии начинаются с #.

SITE=Пример: насосная станция №1
CUSTOMER=Пример: ООО «Заказчик»
RESPONSIBLE=Пример: Иванов И.И., +7 900 000-00-00
CHANGE_ID=CHG-2026-0001

# Окно работ в локальном времени площадки. Может переходить через полночь (22:00..06:00).
WINDOW_START=09:00
WINDOW_END=18:00

# Разрешённые цели (CIDR или одиночные IP, через запятую или пробел).
TARGETS=10.10.0.0/24, 10.10.5.10

# Запрещённые адреса. Проверяются раньше TARGETS.
FORBIDDEN=10.10.0.1, 10.10.0.2

# Что разрешено в этом окне (справочно, для отчёта).
ALLOWED_ACTIONS=passive capture; read-only config collection; ping sweep с интервалом >= 5 c

# Контакты на время работ.
CONTACTS=Пример: дежурный АСУ ТП, добавочный 1234

NOTES=Любое отклонение от scope согласуется письменно.
